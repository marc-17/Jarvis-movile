name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q jarvis-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        working-directory: jarvis-android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp jarvis-android/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          gh release create "v${{ github.run_number }}" Jarvis.apk --title "Jarvis ${{ github.run_number }}" --notes "APK de prueba"
